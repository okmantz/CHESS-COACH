<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0e1015">
  <meta name="description" content="Chess Coach — play, analyze and learn chess with Stockfish and a coach that learns from your games.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Chess Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Chess Coach</title>
</head>
<body>
  <div id="splash" class="splash"><div class="col" style="align-items:center"><div class="brand-mark" style="width:54px;height:54px;font-size:30px;border-radius:16px">♞</div><div class="spin"></div></div></div>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottomnav" aria-label="Primary"></nav>
  </div>
  <noscript>Chess Coach needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
